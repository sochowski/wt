# wt menu items — single source of truth for menu and keybindings
# Format: key<TAB>label<TAB>tmux-command
# Use --- for separators, # for comments
#
# Adding a line here automatically creates:
#   1. An entry in the prefix+w menu
#   2. A direct prefix+<key> binding
#
# Run wt-bind-menu to regenerate (also runs on tmux startup).
n	New worktree	display-popup -E -w 80% -h 80% '$HOME/bin/wt new'
s	Switch (pick)	display-popup -E -w 100% -h 100% '$HOME/bin/wt pick'
d	Delete...	display-popup -E -w 60% -h 40% '$HOME/bin/wt delete-pick'
---
p	PR lookup...	display-popup -E -w 60% -h 40% '$HOME/bin/wt pr-pick'
---
m	Master session	switch-client -t wt-master
M	New master...	display-popup -E -w 70% -h 50% '$HOME/bin/wt master --force'
---
r	Sync status	run-shell '$HOME/bin/wt sync-tmux'
l	Toggle layout	run-shell '$HOME/bin/wt toggle-layout'
