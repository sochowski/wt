# =============================================================================
#  wt - Tmux Worktree Integration
#  Source this from your main tmux.conf: source-file ~/.config/wt/tmux-wt.conf
# =============================================================================

# -----------------------------------------------------------------------------
#  Session Switcher (native choose-tree with status icons)
# -----------------------------------------------------------------------------
# Shows all worktree sessions with status icon, name, PR link, and message.
# Filters out the master orchestrator session (use prefix+M for that).
bind W choose-tree -Zs \
  -F "#{?#{@wt-icon},#{@wt-icon},?} #{session_name}#{?#{@wt-pr}, PR###{@wt-pr},}  #{@wt-message}" \
  -f "#{!=:#{@wt-master},1}"

# -----------------------------------------------------------------------------
#  Action Menu & Direct Keybindings (generated from wt-menu.conf)
# -----------------------------------------------------------------------------
# Edit ~/.config/wt/wt-menu.conf to add/remove items.
# Each item gets both a menu entry (prefix+w) and a direct binding (prefix+key).
run-shell "$HOME/bin/wt-bind-menu"

# -----------------------------------------------------------------------------
#  Auto-sync tmux options on session creation
# -----------------------------------------------------------------------------
set-hook -g session-created "run-shell '$HOME/bin/wt sync-tmux'"

# -----------------------------------------------------------------------------
#  Scrollback & Mouse
# -----------------------------------------------------------------------------
set -g mouse on
set -g history-limit 50000

# -----------------------------------------------------------------------------
#  Popup styling (tmux 3.3+)
# -----------------------------------------------------------------------------
if-shell 'tmux -V | awk "{if (\$2+0 >= 3.3) exit 0; else exit 1}"' \
    'set -g popup-border-style "fg=colour8"; set -g popup-border-lines rounded'

# -----------------------------------------------------------------------------
#  Status Bar - Worktree Status Segment
# -----------------------------------------------------------------------------
# Add worktree status to your status-right. Example:
#   set -g status-right "#($HOME/bin/wt-tmux-status) | %H:%M"
#
# Icons:
#   ◆  = master session active
#   ●N = N worktrees with Claude working (green)
#   ○N = N worktrees idle (blue)
#   ⊘N = N worktrees needing input (yellow)
#   ✗N = N worktrees with errors (red)
