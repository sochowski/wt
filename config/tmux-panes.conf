# =============================================================================
#  wt - dwm/i3-style pane management
#  Sourced from tmux-wt.conf. Delete that one source line to fully disable.
# =============================================================================
#
# Design: dwm's keymap, made portable + collision-free.
#
#   dwm relies on `Mod`+key, but Mod is grabbed by your window manager (dwm,
#   i3, sway) *before* the terminal — and whether Alt/Super even reaches tmux
#   varies by OS/terminal (macOS Option-as-Meta, etc.). So instead of a
#   modifier we gate the dwm keys behind the tmux prefix (Ctrl-based — no WM
#   or terminal grabs it) and use bare keys after it (no modifier — nothing
#   can intercept them). Result: identical behavior on dwm, i3, macOS, WSL...
#
#   `-r` makes each key repeatable within `repeat-time`, so a burst like
#   `prefix j j h l` needs the prefix only once. No mode to enter or exit.
#
#   `wt mobile` attaches with tmux's `no-detach-on-destroy` client flag as a
#   non-focus client-local marker. In ordinary (non-WT) windows for that client,
#   h/j/k/l become directional fullscreen navigation: select the pane in that
#   direction and zoom it. `prefix z` restores the split. Other clients retain
#   the desktop key actions. The resulting tmux zoom state is window-global,
#   so two clients viewing the same window still see the same zoomed pane.
#
#   Keymap (mirrors stock dwm):
#     prefix j / k   focus prev/next pane   (dwm focusstack)
#     prefix h / l   shrink / grow master   (dwm setmfact)
#     prefix Enter   promote to master      (dwm zoom)
#
#   NOTE: `prefix l` shadows the default `last-window` binding (kept for the
#   dwm muscle memory). `last-window` is still on `prefix p`/`prefix n` etc.

# Comfortable burst window for the -r repeats (default is 500ms).
set -g repeat-time 600

# -----------------------------------------------------------------------------
#  Focus — cycle the pane stack (dwm Mod+j / Mod+k). Do not use display-panes:
#  its key-capturing overlay swallows subsequent repeat keys.
# -----------------------------------------------------------------------------
# WT windows always use durable master-stack operations (including mobile).
# Ordinary tmux retains the directional/zoom and raw-pane fallback.
bind -r j if-shell -F '#{@wt-stack-managed}' {
    run-shell "#{@wt-stack-cli} cycle #{@wt-root} #{@wt-view} next"
} {
    if-shell -F '#{m:*no-detach-on-destroy*,#{client_flags}}' {
        select-pane -D
        resize-pane -Z
    } {
        select-pane -t '{next}'
    }
}
bind -r k if-shell -F '#{@wt-stack-managed}' {
    run-shell "#{@wt-stack-cli} cycle #{@wt-root} #{@wt-view} previous"
} {
    if-shell -F '#{m:*no-detach-on-destroy*,#{client_flags}}' {
        select-pane -U
        resize-pane -Z
    } {
        select-pane -t '{previous}'
    }
}
bind -r h if-shell -F '#{@wt-stack-managed}' {
    run-shell "#{@wt-stack-cli} master-width #{@wt-root} #{@wt-view} -5"
} {
    if-shell -F '#{m:*no-detach-on-destroy*,#{client_flags}}' {
        select-pane -L
        resize-pane -Z
    } {
        resize-pane -t '{top-left}' -L 3
    }
}
bind -r l if-shell -F '#{@wt-stack-managed}' {
    run-shell "#{@wt-stack-cli} master-width #{@wt-root} #{@wt-view} +5"
} {
    if-shell -F '#{m:*no-detach-on-destroy*,#{client_flags}}' {
        select-pane -R
        resize-pane -Z
    } {
        resize-pane -t '{top-left}' -R 3
    }
}
bind -r Enter if-shell -F '#{@wt-stack-managed}' {
    run-shell "#{@wt-stack-cli} promote #{@wt-root} #{@wt-view}"
} {
    swap-pane -s '{top-left}'
    select-pane -t '{top-left}'
    display-message -d 500 "promoted to master"
}

# -----------------------------------------------------------------------------
#  Visualization
# -----------------------------------------------------------------------------
# 1) Repeat-burst badge: a reverse-video " ◧ PANE " lights up in status-left
#    while the prefix/repeat window is live, then vanishes. We *prepend* it to
#    your existing status-left (rather than replace it) so your colour scheme
#    is preserved — the badge uses #[reverse], which inverts your own status
#    colours instead of imposing a hue. Idempotent (guarded by client_prefix);
#    the `#` chars are built with printf so run-shell doesn't expand them.
#    NOTE: client_prefix is generic to any prefix press, not pane-only.
run-shell 'cur="$(tmux show -gqv status-left)"; case "$cur" in *client_prefix*) : ;; *) h="$(printf "\043")"; tmux set -g status-left "${h}{?client_prefix,${h}[reverse${h},bold] ◧ PANE ${h}[default] ,}${cur}"; len="$(tmux show -gqv status-left-length)"; [ "${len:-0}" -lt 40 ] && tmux set -g status-left-length 40; : ;; esac'

# 2) Per-pane border bars. tmux draws only ONE shared divider between adjacent
#    panes — there is no 4-sided box per pane (tmux#1786, closed). The only
#    dedicated, per-pane border element tmux has is pane-border-status: a
#    one-row bar on each pane. We highlight the ACTIVE pane's bar (reverse
#    video) and dim the others, so every pane is framed by its own labelled
#    strip that can't be confused between sides. `both` indicators + double
#    divider still mark the shared edge. Costs one row per pane — set
#    pane-border-status to `off` to reclaim it. Colours come from #[reverse]/
#    #[dim], so your theme's hues are used (no fixed colour imposed).
set -g pane-border-lines      single
set -g pane-border-indicators both
set -g pane-border-status     top
set -g pane-border-format     "#{?pane_active,#[reverse#,bold] #P #{pane_current_command} #[default],#[dim] #P #{pane_current_command} }"
